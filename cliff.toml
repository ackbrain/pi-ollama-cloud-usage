[changelog]
header = "## Changelog\n"
body = """
{% for group in commits | group_by(attribute="scope") %}
### {{ group | first | upper_first }}
{% for commit in group | sort(attribute="scope") %}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
trim = true
footer = "<!-- generated by git-cliff -->"
# remove the leading `v` from tags (e.g. v1.0.1 -> 1.0.1)
tag_pattern = "[0-9].*"

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
